services:
  frontend:
    image: node:22-alpine
    # host networking (Linux only) so this container can reach the
    # firebase-tools emulators at plain localhost:8080/9099 — see
    # VITE_USE_FIREBASE_EMULATOR below. On Mac/Windows, drop network_mode,
    # restore the port mapping, and point the emulator hosts at
    # host.docker.internal instead.
    network_mode: host
    environment:
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
      - VITE_USE_FIREBASE_EMULATOR=${VITE_USE_FIREBASE_EMULATOR:-false}
    volumes:
      - .:/app
    command: sh -c "yarn && yarn dev"
    working_dir: /app

  firebase-tools:
    build:
      context: firebase-tools
    network_mode: host
    volumes:
      - ./firebase/:/firebase
      - firebase-tools-config:/root/.config

volumes:
    firebase-tools-config: {}
